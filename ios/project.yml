name: CrateMind
options:
  bundleIdPrefix: de.dirklange
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: C75X5U984U
    CODE_SIGN_STYLE: Automatic
targets:
  CrateMind:
    type: application
    platform: iOS
    sources: [CrateMind]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.dirklange.cratemind
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: CrateMind/Info.plist
      properties:
        CFBundleDisplayName: CrateMind
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [audio]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        NSLocalNetworkUsageDescription: CrateMind verbindet sich mit deinem Server im Heimnetz.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
