services:
  analysis:
    build: .
    # ponytail: essentia-tensorflow has no linux/arm64 wheel; run under x86_64
    # emulation on Apple Silicon. Enable "Rosetta for x86/amd64 emulation" in
    # Docker Desktop for near-native speed, otherwise it falls back to QEMU.
    platform: linux/amd64
    volumes:
      - /Volumes/Platte/Musik:/music:ro
      - ./data:/data
    environment:
      - MUSIC_DIR=/music
      - DB_PATH=/data/library.db
      - SCAN_INTERVAL_SECONDS=1800
    restart: unless-stopped

  webapp:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # ponytail: read-write so the "retry failed tracks" endpoint can flip
      # status back to pending; the analysis service still owns all other writes.
      - ./data:/data
    environment:
      - DB_PATH=/data/library.db
      - VUIO_BASE_URL=http://192.168.0.54:8080
    restart: unless-stopped
