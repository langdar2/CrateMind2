name: iOS IPA

# Baut eine unsignierte IPA, die Sideloadly beim Installieren neu signiert.
on:
  workflow_dispatch:
  push:
    tags: ["ios-*"]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (unsigniert)
        working-directory: ios
        run: |
          xcodebuild \
            -project CrateMind.xcodeproj \
            -scheme CrateMind \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: IPA packen
        working-directory: ios
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/CrateMind.app Payload/
          zip -qr CrateMind.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CrateMind-ipa
          path: ios/CrateMind.ipa
          if-no-files-found: error

      - name: Release anhängen (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/ios-')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/CrateMind.ipa
