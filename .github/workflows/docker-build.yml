name: Docker Build

on:
  push:
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t crate-mind-analysis .

      - name: Smoke test essentia import
        run: docker run --rm crate-mind-analysis python -c "import essentia.standard; print('essentia ok')"

      - name: Essentia feature-extraction self-test
        run: docker run --rm crate-mind-analysis python -m crate_mind.analysis.features --self-test
